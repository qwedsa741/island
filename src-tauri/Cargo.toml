[package]
name = "island"
version = "0.2.0"
description = "A quiet, local-first desktop collector"
authors = ["Island contributors"]
edition = "2021"
license = "Apache-2.0"

[lib]
name = "island_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
ammonia = "4"
chrono = { version = "0.4", features = ["serde"] }
csv = "1"
mime_guess = "2"
open = "5"
pdf-extract = "0.12"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "brotli", "deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2.4.3"
tokio = { version = "1", features = ["fs", "macros", "rt-multi-thread", "sync"] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
